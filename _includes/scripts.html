<script src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
  document.addEventListener(
    "click",
    function (event) {
      var link = event.target.closest("#site-nav a[href*='#']");

      if (
        !link ||
        event.button !== 0 ||
        event.metaKey ||
        event.ctrlKey ||
        event.shiftKey ||
        event.altKey
      ) {
        return;
      }

      var targetUrl = new URL(link.href, window.location.href);
      var hash = targetUrl.hash;

      if (targetUrl.origin !== window.location.origin || !hash) {
        return;
      }

      var target = document.getElementById(hash.substring(1));

      if (!target) {
        return;
      }

      // 阻止主题默认的 smoothScroll
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();

      // 地址栏更新为 /#xxx
      history.pushState(
        null,
        "",
        targetUrl.pathname + targetUrl.search + hash
      );

      // 避开顶部 masthead 后立即跳转
      var masthead = document.querySelector(".masthead");
      var offset = masthead
        ? masthead.getBoundingClientRect().height + 12
        : 72;

      var targetTop =
        target.getBoundingClientRect().top +
        window.pageYOffset -
        offset;

      window.scrollTo(0, Math.max(0, targetTop));
    },
    true
  );
</script>
